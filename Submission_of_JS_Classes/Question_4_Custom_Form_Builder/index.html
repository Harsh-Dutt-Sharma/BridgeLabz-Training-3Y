<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Form Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <p class="eyebrow">JAVASCRIPT ASSIGNMENT 4</p>
        <h1>Custom Form Builder</h1>
        <p>Generate a form from field definitions and display submitted values.</p>
    </header>
    <main class="container">
        <section class="panel"><h2>Generated form</h2><form id="generated-form"></form><h2 class="output-heading">Submitted data</h2><pre id="output">Your submitted values will appear here.</pre></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
