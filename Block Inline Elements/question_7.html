<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Schedule</title>
</head>
<body>
    <h1>Technology Conference Schedule</h1>

    <!-- Conference schedule table -->
    <table border="1">
        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Morning</td>
                <td>10:00 AM</td>
                <td>Artificial Intelligence</td>
                <td>Dr. Sharma</td>
            </tr>
            <tr>
                <td>Afternoon</td>
                <td>2:00 PM</td>
                <td>Web Development</td>
                <td>Ms. Verma</td>
            </tr>
            <tr>
                <td>Evening</td>
                <td>6:00 PM</td>
                <td>Future of Technology</td>
                <td>Mr. Singh</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">End of Conference Schedule</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
