<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Online Store Product Catalog</h1>

    <!-- Product table with product details -->
    <table border="1">
        <tr>
            <th colspan="4">Product Catalog</th>
        </tr>
        <tr>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>Student laptop for everyday work</td>
            <td>₹60,000</td>
            <td rowspan="2">In Stock</td>
        </tr>
        <tr>
            <td>Headphones</td>
            <td>Wireless headphones</td>
            <td>₹2,500</td>
        </tr>
        <tr>
            <td>Keyboard</td>
            <td>Mechanical keyboard</td>
            <td>₹3,000</td>
            <td>Out of Stock</td>
        </tr>
    </table>
</body>
</html>
