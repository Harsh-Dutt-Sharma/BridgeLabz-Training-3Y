<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Carter - Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light text-dark">
    <header class="bg-white shadow-sm">
        <div class="container text-center p-5">
            <h1 class="fw-bold mb-3">Alex Carter</h1>
            <p class="lead mb-0">
                Frontend Developer & UI Designer
            </p>
        </div>
    </header>

    <main>
        <section class="container text-center py-5">
            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
                alt="Profile of Alex Carter"
                class="img-fluid rounded-circle profile-image mb-4"
            >

            <h2 class="fw-bold">Building clean digital experiences</h2>

            <p class="text-secondary mx-auto portfolio-text">
                I create responsive websites and intuitive interfaces with a
                strong focus on accessibility, performance, and visual clarity.
            </p>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="#contact" class="btn btn-primary">Hire Me</a>
                <a href="#" class="btn btn-outline-dark">Download CV</a>
            </div>
        </section>

        <section id="contact" class="container pb-5">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="bg-white p-4 rounded shadow-sm">
                        <h3 class="fw-bold mb-3">Contact Me</h3>

                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Your name"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="you@example.com"
                                >
                            </div>

                            <button type="submit" class="btn btn-dark">
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 Alex Carter</p>
    </footer>
</body>
</html>
