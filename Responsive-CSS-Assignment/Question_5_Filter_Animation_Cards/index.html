<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards With Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-content">
        <header class="page-header">
            <h1>Our Team</h1>
            <p>Hover over a profile to reveal the full-color image.</p>
        </header>

        <section class="profiles" aria-label="Team profiles">
            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="Portrait of Alex">
                <div class="profile-info">
                    <h2>Alex Morgan</h2>
                    <p>Frontend Developer</p>
                </div>
            </article>

            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80" alt="Portrait of Sarah">
                <div class="profile-info">
                    <h2>Sarah Lee</h2>
                    <p>UI/UX Designer</p>
                </div>
            </article>

            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=600&q=80" alt="Portrait of Daniel">
                <div class="profile-info">
                    <h2>Daniel Carter</h2>
                    <p>Backend Developer</p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
