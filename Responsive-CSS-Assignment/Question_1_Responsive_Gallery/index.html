<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter.</p>
    </header>

    <main class="gallery">
        <figure class="gallery-item">
            <img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape">
            <figcaption>Blur</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="grayscale" src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" alt="Forest landscape">
            <figcaption>Grayscale</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="sepia" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Nature landscape">
            <figcaption>Sepia</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="brightness" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Mountain lake">
            <figcaption>Brightness</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="contrast" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80" alt="Green valley">
            <figcaption>Contrast</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="hue-rotate" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Cabin near a lake">
            <figcaption>Hue Rotate</figcaption>
        </figure>
    </main>

    <footer class="page-footer">
        <p>Responsive CSS Filter Gallery</p>
    </footer>
</body>
</html>
