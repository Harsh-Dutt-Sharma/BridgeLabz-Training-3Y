<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2 Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main class="card"><h1>Live Character Counter</h1><p>Write a message (maximum 100 characters).</p><label for="message">Your message</label><textarea id="message" maxlength="100" rows="6"></textarea><div class="row"><strong id="counter">100 characters remaining</strong><span id="status">Ready</span></div><button id="reset" type="button">Reset</button></main>
</body>
</html>
