<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride-Sharing Application</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Ride-Sharing Application</h1>
        <p class="subtitle">View user and driver details, then calculate a validated trip fare.</p>
        <section class="panel"><h2>Trip Details</h2><div id="trip-details"></div></section><section class="panel"><h2>Fare Calculator</h2><label for="distance">Distance (km)</label><br><input id="distance" type="number" min="0" step="0.1" value="12"><button id="calculate" type="button">Calculate Fare</button><p id="fare-output" aria-live="polite"></p></section>
    </main>
</body>
</html>
