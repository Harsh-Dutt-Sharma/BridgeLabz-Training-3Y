<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltips</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Tooltip Demonstration</h1>
    <p>Hover over an item to view its tooltip.</p>
    <section class="tooltips">
      <div class="item"><span class="icon">?</span><span class="tooltip">Help and support</span><strong>Help</strong></div>
      <div class="item"><span class="icon">i</span><span class="tooltip">Additional information</span><strong>Info</strong></div>
      <div class="item"><span class="icon">★</span><span class="tooltip">A favorite item</span><strong>Favorite</strong></div>
      <div class="item"><span class="icon">✓</span><span class="tooltip">Task completed</span><strong>Done</strong></div>
    </section>
  </main>
</body>
</html>
