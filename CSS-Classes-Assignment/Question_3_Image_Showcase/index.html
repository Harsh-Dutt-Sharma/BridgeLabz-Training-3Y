<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Image Showcase</h1><p>A responsive gallery with hover effects.</p></header>
  <main class="gallery">
    <figure><div class="image"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape"><span></span></div><figcaption>Mountain Escape</figcaption></figure>
    <figure><div class="image"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Ocean waves"><span></span></div><figcaption>Ocean Breeze</figcaption></figure>
    <figure><div class="image"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Lake landscape"><span></span></div><figcaption>Quiet Lake</figcaption></figure>
    <figure><div class="image"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Green forest"><span></span></div><figcaption>Forest Walk</figcaption></figure>
    <figure><div class="image"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Desert landscape"><span></span></div><figcaption>Desert Light</figcaption></figure>
    <figure><div class="image"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80" alt="Snowy mountain"><span></span></div><figcaption>Snowy Peaks</figcaption></figure>
  </main>
</body>
</html>
