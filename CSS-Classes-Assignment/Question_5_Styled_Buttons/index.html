<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Buttons</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header><h1>Styled Button Collection</h1><p>Explore button states and styles.</p></header>
    <section class="buttons">
      <button class="primary">Primary</button>
      <button class="secondary">Secondary</button>
      <button class="outline">Outline</button>
      <button class="disabled" disabled>Disabled</button>
    </section>
    <p class="hint">Use hover, click and the Tab key to test the effects.</p>
  </main>
</body>
</html>
