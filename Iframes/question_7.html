<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>
    <h1>Login</h1>

    <form action="#" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <!--
            A CSRF token helps a server verify that a form request
            came from an expected source and helps prevent CSRF attacks.
        -->
        <input type="hidden" name="csrf_token" value="dummy-csrf-token-123">

        <button type="submit">Login</button>
    </form>
</body>
</html>
