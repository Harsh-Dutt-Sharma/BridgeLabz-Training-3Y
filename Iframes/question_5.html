<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Defines UTF-8 character encoding -->
    <meta charset="UTF-8">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Harsh Dutt Sharma">

    <!-- Makes the webpage responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UTF-8 Encoding Demo</title>
</head>
<body>
    <h1>UTF-8 Encoding Demonstration</h1>

    <!-- Text in English, Hindi and Japanese -->
    <p>
        English: Welcome to my webpage.<br>
        Hindi: नमस्ते, मेरी वेबसाइट में आपका स्वागत है।<br>
        Japanese: こんにちは、私のウェブページへようこそ。
    </p>
</body>
</html>
