<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>
    <h1>Contact Us</h1>

    <!-- Contact form with placeholder and required attributes -->
    <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required>
        <br><br>

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required>
        <br><br>

        <label for="subject">Subject:</label>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter the subject"
            required>
        <br><br>

        <label for="message">Message:</label><br>
        <textarea
            id="message"
            name="message"
            rows="6"
            cols="40"
            placeholder="Write your message here"
            required></textarea>
        <br><br>

        <button type="submit">Send Message</button>
    </form>
</body>
</html>
