<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Video Embed</title>
</head>
<body>
    <!-- YouTube video embedded using an iframe -->
    <h1>My Favorite Video</h1>

    <!-- Percentage values make the iframe adjust with the browser size -->
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="80%"
        height="50%"
        title="YouTube Video">
    </iframe>
</body>
</html>
