<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h1>Map of Mathura</h1>

    <!--
        loading="lazy" tells the browser to load the iframe when it is
        needed/near the visible part of the page, helping page performance.
    -->
    <iframe
        src="https://www.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
