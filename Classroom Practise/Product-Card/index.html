<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
</head>
<body>
    
    <div class="container">

        <div class="product-card">
            <div class="icons">
                <span class="discount-logo">20% OFF</span>
                <button type="button" class="wishlist-btn" aria-label = "Add to wishlist">♥</button>
            </div>
            
            <div class="shoe-image">
                <img src="./images/image.png" alt="Red running shoe">
            </div>

            <div class="card-content">
                <p class="shoe-category">SPORTS SHOES</p>
                <h3 class="shoe-name">Premium Running Shoes</h3>
                <div class="rating">
                    <span class = "stars">★★★★★</span>
                    <span class="review-count">(120)</span>
                </div>
                <div class="price">
                    <span class="current-price">₹1,999</span>
                    <s class="old-price">₹2,499</s>
                </div>
                <button type="button" class = "add-to-cart">Add to cart</button>
            </div>

        </div>
    </div>

</body>
</html>
